<article class="paper-card">
  <h3 class="paper-title">{{ item.title }}</h3>
  <p class="paper-meta">{{ item.authors | join: ", " }} &middot; {{ item.venue }} ({{ item.year }})</p>
  <p class="paper-summary">{{ item.summary }}</p>
  <p class="paper-status">{{ item.status | replace: "_", " " }}</p>
  {% if item.source_url != "" %}
  <a class="paper-code" href="{{ item.source_url }}">Source code</a>
  {% endif %}
</article>
